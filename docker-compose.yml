services:
  db:
    image: postgis/postgis:17-3.5-alpine
    container_name: urban-trajectory-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trajectory_db}
      POSTGRES_USER: ${POSTGRES_USER:-trajectory_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trajectory_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trajectory_user} -d ${POSTGRES_DB:-trajectory_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
